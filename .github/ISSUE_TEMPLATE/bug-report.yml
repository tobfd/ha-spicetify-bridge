name: Bug Report
description: Report a bug that you found
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        - Check if the bug was already reported.
        - Include only one bug per issue.

  - type: input
    attributes:
      label: ha-spicetify-bridge Version
      description: Which version of ha-spicetify-bridge are you using? Check the version with the update entity in Home Assistant from HACS integration.
      placeholder: X.Y.Z
    validations:
      required: true

  - type: textarea
    attributes:
      label: Bug Description
      description: Please provide a brief summary of the bug.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Reproduction Steps
      description: Write down the steps to reproduce the bug.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Results
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual Results
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    attributes:
      label: error traceback
      description: If the bug caused an error, please provide the full traceback.
    validations:
      required: false
